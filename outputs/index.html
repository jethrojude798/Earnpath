else if(page==='Help & safety'){v.innerHTML=`<div class="welcome"><div><div class="eyebrow">Practical guidance</div><h1 class="h1">Help & safety</h1><p class="sub">Use these checks before applying, messaging or meeting for work.</p></div></div><div class="grid help-grid"><article class="card help-card"><div class="help-icon">₦</div><h2>Never pay to get a job</h2><p>A request for a recruitment, application or “guaranteed placement” fee is a warning sign. Ask for clear compensation and written scope before starting work.</p></article><article class="card help-card"><div class="help-icon">✓</div><h2>Review provider details</h2><p>A platform review is only a moderation step. It cannot guarantee honesty, payment or a safe outcome. Verify who you’re dealing with independently.</p></article><article class="card help-card"><div class="help-icon">⌖</div><h2>Plan in-person work safely</h2><p>Meet in a public or professional location when possible. Tell someone you trust where you’re going, and arrange your own transport.</p></article><article class="card help-card"><div class="help-icon">▣</div><h2>Protect personal information</h2><p>Don’t share passwords, one-time codes, banking PINs or identity documents in chat. Only provide information when there is a clear, secure reason.</p></article></div><div class="card safety-report"><div><h2>Something doesn’t feel right?</h2><p>Report suspicious listings, messages or work records. Reports in this preview stay on this device and are not reviewed by a team.</p></div><button class="btn secondary" onclick="reportIssue('general','EarnPath safety')">Make a sample report</button></div><p class="sub" style="margin-top:14px">For a real service, urgent safety concerns need a clear support contact and an active response process.</p>`}

else if(page==='Manage listings'){v.innerHTML=`<div class="welcome"><div><div class="eyebrow">Employer workspace</div><h1 class="h1">Manage listings</h1><p class="sub">Draft, submit and track your opportunities through review.</p></div><button class="btn primary" onclick="createListing()">＋ Create listing</button></div><div class="card empty"><b>No listings yet</b><span>Your drafts and review decisions will appear here.</span></div>`}

function toastMsg(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2700)}function showModal(h){document.getElementById('modalBody').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
let profilePhotoUrl='',photoZoom=1,activeChat='',chatConversations=[],chatRealtime=null,chatRefreshTimer=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatarContent(){return profilePhotoUrl?`<img src="${profilePhotoUrl}" alt="Profile photo" style="transform:scale(${photoZoom})">`:esc(userName.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}
function refreshAvatars(){['avatar','topAvatar','profileAvatar','employerAvatar','signupPhotoPreview'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerHTML=avatarContent()})}
function selectRole(role){let sel=document.getElementById('signupRole');if(sel)sel.value=role;document.querySelectorAll('.role-choice').forEach(b=>b.classList.toggle('selected',b.dataset.role===role));roleFields()}
function startSignup(){showModal(`<div class="step-label">01 · SET UP YOUR PROFILE</div><div class="modalhead"><h2>Create your EarnPath account</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub signup-intro">Choose how you’ll use EarnPath. We’ll shape your workspace around that.</p><div class="role-choices"><button class="role-choice selected" data-role="Freelancer" onclick="selectRole('Freelancer')"><span class="role-icon">◇</span><span><b>Freelancer</b><small>Show your skills and connect with work</small></span></button><button class="role-choice" data-role="Employer" onclick="selectRole('Employer')"><span class="role-icon">▧</span><span><b>Employer</b><small>Find talent and post opportunities</small></span></button></div><select id="signupRole" class="hide" onchange="roleFields()"><option>Freelancer</option><option>Employer</option></select><div class="form-grid"><div class="field"><label for="signupName">Your name</label><input id="signupName" autocomplete="name" placeholder="Full name"></div><div class="field"><label for="signupEmail">Email address</label><input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com"></div></div><div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></div><div id="roleFields"></div><div class="photo-pick"><div class="photo-thumb" id="signupPhotoPreview">${avatarContent()}</div><div style="flex:1"><label style="font-size:10px;font-weight:700;display:block;margin-bottom:5px">Profile photo <span style="font-weight:400;color:var(--muted)">· preview only for now</span></label><input type="file" accept="image/*" onchange="photoPicked(this)"><div class="photo-controls"><small>Crop</small><input type="range" min="1" max="2" step=".05" value="1" oninput="setPhotoZoom(this.value)"><button class="link" onclick="resetPhoto()">Reset</button></div></div></div><div class="notice"><b>Privacy:</b> EarnPath does not collect NIN or driver’s licence details during signup.</div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" id="signupSubmit" onclick="completeSignup()">Create account</button></div><p class="sub" style="margin-top:14px;text-align:center">Already have an account? <button class="link" onclick="startSignin()">Sign in</button></p>`);roleFields()}
function roleFields(){let r=document.getElementById('signupRole')?.value||'Freelancer',el=document.getElementById('roleFields');if(!el)return;el.innerHTML=r==='Employer'?`<div class="field"><label for="signupBusinessName">Organisation or business name</label><input id="signupBusinessName" autocomplete="organization" placeholder="Organisation name" required></div>`:`<div class="form-grid"><div class="field"><label for="signupCity">City</label><input id="signupCity" autocomplete="address-level2" placeholder="e.g. Ibadan"></div><div class="field"><label for="signupState">State</label><input id="signupState" autocomplete="address-level1" placeholder="e.g. Oyo"></div></div>`}
async function completeSignup(){if(authBusy)return;let client=getSupabase();if(!client){toastMsg('Supabase client is not available. Check your connection and refresh.');return}let role=document.getElementById('signupRole')?.value||'Freelancer',name=document.getElementById('signupName')?.value.trim(),email=document.getElementById('signupEmail')?.value.trim(),password=document.getElementById('signupPassword')?.value,businessName=document.getElementById('signupBusinessName')?.value.trim()||'',city=document.getElementById('signupCity')?.value.trim()||'',state=document.getElementById('signupState')?.value.trim()||'';if(!name||!email||!password){toastMsg('Enter your name, email and password.');return}if(password.length<8){toastMsg('Use a password with at least 8 characters.');return}if(role==='Employer'&&!businessName){toastMsg('Enter your organisation or business name.');return}authBusy=true;let btn=document.getElementById('signupSubmit');if(btn){btn.disabled=true;btn.textContent='Creating account…'}try{let redirect=location.protocol==='http:'||location.protocol==='https:'?location.origin+location.pathname:undefined;let {data,error}=await client.auth.signUp({email,password,options:{data:{role:role.toLowerCase(),display_name:name,business_name:businessName,city,state},...(redirect?{emailRedirectTo:redirect}:{})}});if(error)throw error;closeModal();if(data.session){await activateAuthUser(data.user);toastMsg('Your EarnPath account is ready.')}else{showModal(`<div class="modalhead"><h2>Check your email</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub" style="margin-top:14px;line-height:1.7">We sent a confirmation link to <b>${esc(email)}</b>. Confirm your email, then sign in to EarnPath.</p><div class="actions"><button class="btn primary" onclick="closeModal();startSignin()">Go to sign in</button></div>`)}}catch(e){toastMsg(e.message||'Account creation failed. Please try again.')}finally{authBusy=false}}
function startSignin(){showModal(`<div class="modalhead"><h2>Sign in to EarnPath</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub signup-intro">Continue to your freelancer or employer workspace.</p><div class="field"><label for="signinEmail">Email address</label><input id="signinEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="signinPassword">Password</label><input id="signinPassword" type="password" autocomplete="current-password" placeholder="Your password"></div><div class="actions"><button class="btn secondary" onclick="closeModal();startSignup()">Create account</button><button class="btn primary" id="signinSubmit" onclick="signIn()">Sign in</button></div>`)}
async function signIn(){if(authBusy)return;let client=getSupabase(),email=document.getElementById('signinEmail')?.value.trim(),password=document.getElementById('signinPassword')?.value;if(!client){toastMsg('Supabase client is not available. Check your connection and refresh.');return}if(!email||!password){toastMsg('Enter your email and password.');return}authBusy=true;let btn=document.getElementById('signinSubmit');if(btn){btn.disabled=true;btn.textContent='Signing in…'}try{let {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;closeModal();await activateAuthUser(data.user);toastMsg('You are signed in.')}catch(e){toastMsg(e.message||'Sign-in failed. Please try again.')}finally{authBusy=false}}
async function activateAuthUser(user){let client=getSupabase();if(!client||!user||authActivationUserId===user.id)return;authActivationUserId=user.id;let {data:profile,error}=await client.from('profiles').select('user_id,role,display_name,city,state').eq('user_id',user.id).single();if(error){authActivationUserId=null;toastMsg('Signed in, but your profile could not be loaded: '+error.message);return}currentAuthUser=user;currentRole=profile.role==='employer'?'Employer':'Freelancer';userName=profile.display_name||user.email||'EarnPath member';let meta=user.user_metadata||{};if(currentRole==='Employer'&&meta.business_name){let {data:employer}=await client.from('employer_profiles').select('user_id').eq('user_id',user.id).maybeSingle();if(!employer){let {error:employerError}=await client.from('employer_profiles').insert({user_id:user.id,business_name:meta.business_name});if(employerError)toastMsg('Account is active, but employer profile setup needs attention: '+employerError.message)}}let update={};if(meta.city&&!profile.city)update.city=meta.city;if(meta.state&&!profile.state)update.state=meta.state;if(Object.keys(update).length)await client.from('profiles').update(update).eq('user_id',user.id);document.getElementById('userName').textContent=userName;document.getElementById('roleLabel').textContent=currentRole+' account';let action=document.getElementById('authAction');if(action)action.textContent='Sign out';page=currentRole==='Employer'?'Employer space':'Overview';document.getElementById('crumb').textContent=page;drawNav();render();refreshAvatars()}
async function handleAuthAction(){if(currentAuthUser){let {error}=await getSupabase().auth.signOut();if(error){toastMsg(error.message);return}stopChatRealtime();currentAuthUser=null;authActivationUserId=null;chatConversations=[];activeChat='';currentRole='Freelancer';userName='Ada Okafor';page='Overview';document.getElementById('userName').textContent=userName;document.getElementById('roleLabel').textContent='Preview account';let action=document.getElementById('authAction');if(action)action.textContent='Sign in';drawNav();render();refreshAvatars();toastMsg('You are signed out.')}else startSignin()}
async function initAuth(){let client=getSupabase();if(!client)return;let {data}=await client.auth.getSession();if(data.session?.user)await activateAuthUser(data.session.user);client.auth.onAuthStateChange((_event,session)=>{if(session?.user)setTimeout(()=>activateAuthUser(session.user),0);else{stopChatRealtime();currentAuthUser=null;authActivationUserId=null;chatConversations=[];activeChat='';let action=document.getElementById('authAction');if(action)action.textContent='Sign in'}})}
function photoPicked(input){let f=input.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toastMsg('Choose an image file.');return}if(profilePhotoUrl.startsWith('blob:'))URL.revokeObjectURL(profilePhotoUrl);profilePhotoUrl=URL.createObjectURL(f);photoZoom=1;refreshAvatars()}
function setPhotoZoom(v){photoZoom=Number(v)||1;refreshAvatars()}
function resetPhoto(){if(profilePhotoUrl.startsWith('blob:'))URL.revokeObjectURL(profilePhotoUrl);profilePhotoUrl='';photoZoom=1;refreshAvatars()}
function editProfilePhoto(){showModal(`<div class="modalhead"><h2>Edit profile photo</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub" style="margin-bottom:15px">Choose a photo, then adjust the crop. This preview keeps it in this browser session only.</p><div class="photo-pick"><div class="photo-thumb" id="signupPhotoPreview">${avatarContent()}</div><div><label style="font-size:10px;font-weight:700;display:block;margin-bottom:6px">Change photo</label><input type="file" accept="image/*" onchange="photoPicked(this)"></div></div><div class="photo-controls"><small>Zoom / crop</small><input type="range" min="1" max="2" step=".05" value="${photoZoom}" oninput="setPhotoZoom(this.value)"><button class="link" onclick="resetPhoto()">Remove</button></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();toastMsg('Profile photo updated for this preview session.')">Save photo</button></div>`)}
async function fetchChatInbox(){let client=getSupabase();if(!client||!currentAuthUser)throw new Error('Sign in to open your messages.');let uid=currentAuthUser.id;let {data:rows,error}=await client.from('conversations').select('id,freelancer_id,employer_id,opportunity_id,created_at').order('created_at',{ascending:false});if(error)throw error;let {data:blocks,error:blockError}=await client.from('user_blocks').select('blocked_id').eq('blocker_id',uid);if(blockError)throw blockError;let blocked=new Set((blocks||[]).map(x=>x.blocked_id));let visible=(rows||[]).filter(c=>!blocked.has(c.freelancer_id===uid?c.employer_id:c.freelancer_id));let peerIds=[...new Set(visible.map(c=>c.freelancer_id===uid?c.employer_id:c.freelancer_id))];if(!peerIds.length)return [];let {data:profiles,error:profileError}=await client.from('profiles').select('user_id,role,display_name,city,state').in('user_id',peerIds);if(profileError)throw profileError;let employerIds=(profiles||[]).filter(p=>p.role==='employer').map(p=>p.user_id);let employerNames={};if(employerIds.length){let {data:employers,error:employerError}=await client.from('employer_profiles').select('user_id,business_name').in('user_id',employerIds);if(employerError)throw employerError;(employers||[]).forEach(x=>employerNames[x.user_id]=x.business_name)}let ids=visible.map(c=>c.id),messages=[];if(ids.length){let {data:messageRows,error:messageError}=await client.from('messages').select('id,conversation_id,sender_id,body,created_at').in('conversation_id',ids).order('created_at',{ascending:true});if(messageError)throw messageError;messages=messageRows||[]}let profileMap=Object.fromEntries((profiles||[]).map(p=>[p.user_id,p]));let grouped={};messages.forEach(m=>(grouped[m.conversation_id]??=[]).push({id:m.id,mine:m.sender_id===uid,text:m.body,created_at:m.created_at,time:new Date(m.created_at).toLocaleString([],{dateStyle:'short',timeStyle:'short'})}));return visible.map(c=>{let peerId=c.freelancer_id===uid?c.employer_id:c.freelancer_id,p=profileMap[peerId]||{},name=(p.role==='employer'&&employerNames[peerId])||p.display_name||'EarnPath member',roleLabel=p.role==='employer'?'Employer':'Freelancer',location=[p.city,p.state].filter(Boolean).join(', '),list=grouped[c.id]||[];return {id:c.id,peerId,name,role:roleLabel+(location?' · '+location:''),initials:name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),messages:list,lastAt:list.at(-1)?.created_at||c.created_at}}).sort((a,b)=>new Date(b.lastAt)-new Date(a.lastAt))}
async function renderMessages(v){if(!currentAuthUser){v.innerHTML=`<div class="welcome"><div><div class="eyebrow">EarnPath connections</div><h1 class="h1">Messages</h1><p class="sub">Sign in to see and send your private messages.</p></div><button class="btn primary" onclick="startSignin()">Sign in</button></div><div class="card empty"><b>Your inbox is private</b><span>Conversations appear here after you sign in.</span></div>`;return}v.innerHTML=`<div class="welcome"><div><div class="eyebrow">EarnPath connections</div><h1 class="h1">Messages</h1><p class="sub">Private conversations between EarnPath members.</p></div><div style="display:flex;gap:8px"><button class="btn secondary" onclick="refreshChatInbox()">Refresh</button><button class="btn primary" onclick="newChat()">＋ New message</button></div></div><div id="chatContent" class="card empty"><b>Loading your messages…</b></div>`;try{chatConversations=await fetchChatInbox();if(!chatConversations.some(c=>c.id===activeChat))activeChat=chatConversations[0]?.id||'';renderChatContent(v);startChatRealtime()}catch(e){document.getElementById('chatContent').innerHTML=`<b>Messages couldn’t load</b><span>${esc(e.message||'Please try again.')}</span><br><button class="btn secondary" style="margin-top:14px" onclick="refreshChatInbox()">Try again</button>`}}
function renderChatContent(v=document.getElementById('view')){if(!v||page!=='Messages')return;let content=document.getElementById('chatContent');if(!content)return;if(!chatConversations.length){content.className='card empty';content.innerHTML=`<div style="font-size:26px">✉</div><b>Your inbox is clear</b><span>Start a conversation with a registered ${currentRole==='Employer'?'freelancer':'employer'}.</span><br><button class="btn primary" style="margin-top:15px" onclick="newChat()">＋ New message</button>`;return}content.className='card chat-layout';let c=chatConversations.find(x=>x.id===activeChat)||chatConversations[0];activeChat=c.id;content.innerHTML=`<div class="chat-list"><div class="head"><h2>Conversations</h2></div>${chatConversations.map(x=>`<button class="chat-person ${x.id===c.id?'active':''}" onclick="selectChat('${x.id}')"><span class="logo">${esc(x.initials)}</span><span><b>${esc(x.name)}</b><small>${esc(x.role)}</small></span></button>`).join('')}</div><div class="chat-thread"><div class="chat-head"><span class="logo">${esc(c.initials)}</span><div style="flex:1"><b>${esc(c.name)}</b><small>${esc(c.role)}</small></div><button class="report-link" onclick="reportChatUser('${c.peerId}','${esc(c.name)}')">Report</button><button class="report-link" onclick="blockChat('${c.peerId}','${esc(c.name)}')">Block</button></div><div class="messages" id="messageList">${c.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}<small>${m.mine?'You':esc(c.name)} · ${esc(m.time)}</small></div>`).join('')}</div><form class="composer" onsubmit="sendChat(event)"><input id="messageInput" maxlength="4000" placeholder="Write a message…" autocomplete="off" aria-label="Message"><button class="btn primary" id="sendChatButton" type="submit">Send</button></form><div class="chat-note">Messages are saved to your EarnPath account. Keep passwords, one-time codes and identity documents out of chat.</div></div>`;let list=document.getElementById('messageList');if(list)list.scrollTop=list.scrollHeight}
function selectChat(id){activeChat=id;renderChatContent()}
function stopChatRealtime(){if(chatRefreshTimer){clearInterval(chatRefreshTimer);chatRefreshTimer=null}if(chatRealtime&&authClient){authClient.removeChannel(chatRealtime);chatRealtime=null}}
function startChatRealtime(){if(!authClient||!currentAuthUser)return;if(chatRealtime)authClient.removeChannel(chatRealtime);chatRealtime=authClient.channel('earnpath-chat-'+currentAuthUser.id).on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>{if(page==='Messages')refreshChatInbox(true)}).on('postgres_changes',{event:'INSERT',schema:'public',table:'conversations'},()=>{if(page==='Messages')refreshChatInbox(true)}).subscribe();if(!chatRefreshTimer)chatRefreshTimer=setInterval(()=>{if(page==='Messages'&&document.visibilityState==='visible')refreshChatInbox(true)},12000)}
async function refreshChatInbox(quiet=false){if(!currentAuthUser||page!=='Messages')return;try{chatConversations=await fetchChatInbox();if(!chatConversations.some(c=>c.id===activeChat))activeChat=chatConversations[0]?.id||'';renderChatContent()}catch(e){if(!quiet)toastMsg(e.message||'Could not refresh messages.')}}
async function newChat(){if(!currentAuthUser){startSignin();return}let client=getSupabase(),role=currentRole==='Employer'?'freelancer':'employer';showModal(`<div class="modalhead"><h2>New message</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">Choose a ${role} to start a private conversation.</p><div id="newChatChoices" class="card empty"><b>Loading members…</b></div>`);let box=document.getElementById('newChatChoices');try{let {data:profiles,error}=await client.from('profiles').select('user_id,role,display_name,city,state').eq('role',role).neq('user_id',currentAuthUser.id).order('display_name');if(error)throw error;let ownBlocks=await client.from('user_blocks').select('blocked_id').eq('blocker_id',currentAuthUser.id);if(ownBlocks.error)throw ownBlocks.error;let blocked=new Set((ownBlocks.data||[]).map(x=>x.blocked_id));profiles=(profiles||[]).filter(p=>!blocked.has(p.user_id));let names={};if(role==='employer'&&profiles.length){let {data:employers,error:employerError}=await client.from('employer_profiles').select('user_id,business_name').in('user_id',profiles.map(p=>p.user_id));if(employerError)throw employerError;(employers||[]).forEach(x=>names[x.user_id]=x.business_name)}if(!profiles.length){box.className='card empty';box.innerHTML=`<b>No ${role}s to message yet</b><span>When another member creates an account, they can be contacted here.</span>`;return}box.className='';box.innerHTML=profiles.map(p=>{let name=(p.role==='employer'&&names[p.user_id])||p.display_name||'EarnPath member',location=[p.city,p.state].filter(Boolean).join(', ');return `<button class="chat-person card" style="margin:6px 0" onclick="startConversation('${p.user_id}')"><span class="logo">${esc(name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span><span><b>${esc(name)}</b><small>${p.role==='employer'?'Employer':'Freelancer'}${location?' · '+esc(location):''}</small></span></button>`}).join('')}catch(e){box.className='card empty';box.innerHTML=`<b>Members couldn’t load</b><span>${esc(e.message||'Please try again.')}</span>`}}
async function startConversation(peerId){let client=getSupabase(),uid=currentAuthUser?.id;if(!client||!uid)return;let freelancerId=currentRole==='Freelancer'?uid:peerId,employerId=currentRole==='Employer'?uid:peerId;try{let {data:existing,error:findError}=await client.from('conversations').select('id').eq('freelancer_id',freelancerId).eq('employer_id',employerId).is('opportunity_id',null).limit(1).maybeSingle();if(findError)throw findError;let conversation=existing;if(!conversation){let {data,error}=await client.from('conversations').insert({freelancer_id:freelancerId,employer_id:employerId}).select('id').single();if(error&&error.code==='23505'){let retry=await client.from('conversations').select('id').eq('freelancer_id',freelancerId).eq('employer_id',employerId).is('opportunity_id',null).limit(1).maybeSingle();if(retry.error)throw retry.error;conversation=retry.data}else if(error)throw error;else conversation=data}if(!conversation)throw new Error('Could not open this conversation.');activeChat=conversation.id;closeModal();await refreshChatInbox()}catch(e){toastMsg(e.message||'Could not start conversation.')}}
async function sendChat(e){e.preventDefault();let input=document.getElementById('messageInput'),text=input?.value.trim(),c=chatConversations.find(x=>x.id===activeChat);if(!text||!c||!currentAuthUser)return;let btn=document.getElementById('sendChatButton');if(btn){btn.disabled=true;btn.textContent='Sending…'}let {error}=await getSupabase().from('messages').insert({conversation_id:c.id,sender_id:currentAuthUser.id,body:text});if(error){if(btn){btn.disabled=false;btn.textContent='Send'}toastMsg(error.message||'Message could not be sent.');return}await refreshChatInbox(true);let next=document.getElementById('messageInput');if(next)next.focus()}
async function blockChat(peerId,name){if(!currentAuthUser||!confirm(`Block ${name}? You both will be unable to send messages.`))return;let {error}=await getSupabase().from('user_blocks').insert({blocker_id:currentAuthUser.id,blocked_id:peerId});if(error&&error.code!=='23505'){toastMsg(error.message||'Could not block this member.');return}activeChat='';await refreshChatInbox();toastMsg(`${name} is blocked.`)}
function reportChatUser(peerId,name){showModal(`<div class="modalhead"><h2>Report ${esc(name)}</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub" style="margin-bottom:15px">Your report will be sent to EarnPath for review.</p><div class="field"><label for="chatReportReason">What is your concern?</label><select id="chatReportReason"><option value="">Choose a reason</option><option>Possible scam or fee request</option><option>Harassment or unsafe conduct</option><option>Identity or privacy concern</option><option>Other concern</option></select></div><div class="field"><label for="chatReportDetails">Details (optional)</label><textarea id="chatReportDetails" maxlength="1200" placeholder="Share only what is needed to explain the concern"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitChatReport('${peerId}')">Send report</button></div>`)}
async function submitChatReport(peerId){let reason=document.getElementById('chatReportReason')?.value,details=document.getElementById('chatReportDetails')?.value.trim()||'';if(!reason){toastMsg('Choose a reason for the report.');return}let {error}=await getSupabase().from('reports').insert({reporter_id:currentAuthUser.id,target_kind:'profile',target_id:peerId,reason,details});if(error){toastMsg(error.message||'Report could not be sent.');return}closeModal();toastMsg('Your report was sent for review.')}

function sendChat(e){e.preventDefault();let input=document.getElementById('messageInput'),text=input.value.trim();if(!text)return;let chats=chatsForRole().filter(c=>!blockedChatNames().includes(c.name));let peer=chats[activeChat]?.name;if(!peer)return;let all=chatsForRole(),target=all.find(c=>c.name===peer);target.messages.push({mine:true,text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});let key='epChats_'+currentRole;localStorage.setItem(key,JSON.stringify(all));render();let m=document.getElementById('messageList');m.scrollTop=m.scrollHeight}
function filterSkills(){let q=document.getElementById('skillSearch').value.toLowerCase();document.querySelectorAll('.category').forEach(e=>e.classList.toggle('hide',!e.dataset.q.includes(q)))}function filterJobs(){let q=document.getElementById('jobSearch').value.toLowerCase(),t=document.getElementById('jobType').value;document.querySelectorAll('#jobs .op').forEach((e,i)=>e.classList.toggle('hide',!(jobs[i].title+' '+jobs[i].org+' '+jobs[i].desc+' '+jobs[i].skills.join(' ')).toLowerCase().includes(q)||!!t&&jobs[i].type!==t))}
function apply(title){let a=JSON.parse(localStorage.getItem('epApps')||'["Junior Web Assistant"]');if(!a.includes(title))a.unshift(title);localStorage.setItem('epApps',JSON.stringify(a));toastMsg('Sample application saved in this browser.')}function savedTitles(){try{return JSON.parse(localStorage.getItem('epSaved')||'[]')}catch{return []}}function isSaved(title){return savedTitles().includes(title)}function toggleSaved(title){let saved=savedTitles();saved=saved.includes(title)?saved.filter(t=>t!==title):[title,...saved];localStorage.setItem('epSaved',JSON.stringify(saved));toastMsg(saved.includes(title)?'Opportunity saved in this browser.':'Opportunity removed from saved list.');render()}function showOpportunity(title){let o=jobs.find(x=>x.title===title);if(!o)return;showModal(`<div class="modalhead"><h2>${esc(o.title)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="detail-provider"><span class="logo">${esc(o.logo)}</span><div><b>${esc(o.org)}</b><small>${esc(o.loc)} · sample provider, not verified</small></div></div><p style="line-height:1.6;font-size:12px">${esc(o.desc)}</p><div class="detail-grid"><div><small>Opportunity type</small><b>${esc(o.type)}</b></div><div><small>Compensation</small><b>${esc(o.pay)}</b></div><div><small>Work arrangement</small><b>${esc(o.arrangement||'To be confirmed')}</b></div><div><small>Application deadline</small><b>${esc(o.deadline||'See provider')}</b></div></div><div class="notice" style="margin-top:14px">Confirm the work scope and compensation directly with the provider. A platform review does not guarantee payment. Never pay a fee to apply.</div><div class="modal-actions"><button class="report-link" onclick="reportIssue('opportunity','${esc(o.title)}')">Report listing</button><button class="btn secondary" onclick="toggleSavedFromDetails('${esc(o.title)}')">${isSaved(o.title)?'★ Saved':'☆ Save'}</button><button class="btn primary" onclick="closeModal();apply('${esc(o.title)}')">Apply in preview</button></div>`)}
function toggleSavedFromDetails(title){let saved=savedTitles();saved=saved.includes(title)?saved.filter(t=>t!==title):[title,...saved];localStorage.setItem('epSaved',JSON.stringify(saved));showOpportunity(title);toastMsg(saved.includes(title)?'Opportunity saved in this browser.':'Opportunity removed from saved list.')}
function reportIssue(kind,target){showModal(`<div class="modalhead"><h2>Report ${esc(kind)}</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub" style="margin-bottom:15px">${esc(target)} · Reports in this preview stay in this browser and are not sent to a review team.</p><div class="field"><label for="reportReason">What is your concern?</label><select id="reportReason"><option value="">Choose a reason</option><option>Possible scam or fee request</option><option>Misleading compensation or work details</option><option>Harassment or unsafe conduct</option><option>Identity or privacy concern</option><option>Other concern</option></select></div><div class="field"><label for="reportDetail">Details (optional)</label><textarea id="reportDetail" maxlength="1200" placeholder="Share only information needed to explain the concern"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitReport('${esc(kind)}','${esc(target)}')">Save sample report</button></div>`)}
function submitReport(kind,target){let reason=document.getElementById('reportReason').value;if(!reason){toastMsg('Choose a report reason first.');return}let list=[];try{list=JSON.parse(localStorage.getItem('epReports')||'[]')}catch{}list.unshift({kind,target,reason,detail:document.getElementById('reportDetail').value.trim(),created:new Date().toISOString()});localStorage.setItem('epReports',JSON.stringify(list));closeModal();toastMsg('Sample report saved on this device only.')}
function workState(){try{return JSON.parse(localStorage.getItem('epWorkSample')||'{"freelancer":false,"employer":false}')}catch{return {freelancer:false,employer:false}}}function confirmWork(){let s=workState();s[currentRole.toLowerCase()]=true;localStorage.setItem('epWorkSample',JSON.stringify(s));render();toastMsg('Your sample confirmation was recorded in this browser.')}
function addProject(){showModal(`<div class="modalhead"><h2>Add a portfolio project</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Project title</label><input placeholder="e.g. Responsive product page"></div><div class="field"><label>What did you make?</label><textarea placeholder="Describe your contribution"></textarea></div><div class="field"><label>Evidence link (optional)</label><input placeholder="https://…"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();toastMsg('Demo project saved locally.')">Save project</button></div>`)}function createListing(){showModal(`<div class="modalhead"><h2>Draft an opportunity</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">This demo does not send listings to an administrator.</p><div class="field"><label>Opportunity title</label><input placeholder="e.g. Junior design assistant"></div><div class="field"><label>Type</label><select><option>Internship</option><option>Paid project</option><option>Apprenticeship</option></select></div><div class="field"><label>Compensation details</label><input placeholder="State amount or clearly mark unpaid"></div><div class="field"><label>Work details</label><textarea placeholder="Responsibilities, skills and deadline"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Save draft</button><button class="btn primary" onclick="closeModal();toastMsg('Demo listing saved locally.')">Submit for review</button></div>`)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});loadTheme();drawNav();render();initAuth();
</script></body></html>
